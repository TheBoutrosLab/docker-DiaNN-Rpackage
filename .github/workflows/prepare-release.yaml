---
name: 📦 Prepare new release

run-name: Open PR for new release `${{ inputs.version }}`

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version number for the next release (must begin with a digit; omit leading v)
        required: true

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    uses: TheBoutrosLab/tool-create-release/.github/workflows/wf-prepare-release.yaml@v1
    with:
      bump_type: exact
      exact_version: ${{ inputs.version }}
    secrets: inherit
